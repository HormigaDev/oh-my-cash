services:
    backend:
        container_name: omc-backend

        build:
            context: .
            dockerfile: Dockerfile

        image: omc-backend:latest

        network_mode: host

        env_file:
            - /etc/omc/backend.env

        restart: unless-stopped

        init: true

        read_only: true

        tmpfs:
            - /tmp:size=16m,mode=1777

        security_opt:
            - no-new-privileges:true

        cap_drop:
            - ALL

        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "--silent",
                    "--show-error",
                    "http://127.0.0.1:8383/health/ready",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
