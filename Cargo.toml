[package]
name = "oh-my-cash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"

axum = "0.8.7"

tokio = {version = "1", features = ["macros", "rt-multi-thread", "net", "signal"]}
sea-orm = {version = "2.0.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio",
    "macros",
    "with-uuid",
    "with-time",
    "with-rust_decimal"
]}

serde = {version = "1", features = ["derive"]}
serde_json = "1"

uuid = {version = "1.23", features = ["v7", "v4", "serde"]}

time = {version = "0.3", features = ["serde"]}
rust_decimal = {version = "1", features = ["serde"]}

thiserror = "2"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = {version = "0.3", features = [
    "env-filter"
]}

tower-http = {version = "0.7", features = [
    "trace"
]}

tower-cookies = "0.11"

argon2 = "0.5"
getrandom = "0.4"
base64 = "0.23"
sha2 = "0.11"

rpassword = "7"

[workspace]
members = [".", "migration"]
resolver = "2"